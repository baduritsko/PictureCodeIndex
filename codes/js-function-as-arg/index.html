<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<script>
		function changeArray(tableau, action)
		{
			for(let i = 0; i < tableau.length; i++)
			{
				tableau[i] = action(tableau[i]);
			}
		}

		const tableau = [1, 2, 5, 9, 12, 15];
		function run() {
			//changeArray(tableau, y => y *3);
			changeArray(tableau, (x) => {
				if(x % 2 === 0) return x;
				else return x * 3;
			});


			document.getElementById("log-result").innerText = tableau;
		}
	</script>
	<style>
		#log-result { background-color: black; color: white;}
	</style>
</head>
<body>
	<input type="button" value="Run" onclick="run();">
	<div id="log-result">Waiting code run</div>

	<img src="Screenshot_20241114_074714.jpg" alt="source" width="300">

</body>
</html>
