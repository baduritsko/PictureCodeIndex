<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<script>
	function run() {
	const sum = (x, y) => x + y;
	/*
	équivalent à 
		const sum = (x, y) => {
			return x + y;
		};
	*/
	document.getElementById("log-result").innerText = sum(18, 90);
}

	</script>
	<style>
		#log-result { background-color: black; color: white;}
	</style>
</head>
<body>
	<input type="button" value="Run" onclick="run();">
	<div id="log-result">Waiting code run</div>

	<img src="IMG_1730539741011.jpg" alt="source" width="300">

</body>
</html>
